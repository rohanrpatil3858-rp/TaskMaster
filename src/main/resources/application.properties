spring.application.name=taskmaster

# Database connection (password comes from the DB_PASSWORD environment variable)
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmaster
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# update = Hibernate creates/updates tables from our entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}